name: Limpar notícias antigas

on:
  schedule:
    - cron: '0 3 * * *'  # Todo dia às 3h
  workflow_dispatch:

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: cd scripts && npm install
      - run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json
      - env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/serviceAccount.json
        run: |
          cd scripts
          node limpar.js
      - run: rm -f serviceAccount.json
