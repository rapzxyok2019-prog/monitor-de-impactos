name: Coletar notícias automaticamente

on:
  schedule:
    # Horários em UTC (equivalente ao horário de Brasília):
    # 01 UTC = 22h BRT (dia anterior)
    # 03 UTC = 00h BRT
    # 07 UTC = 04h BRT
    # 09 UTC = 06h BRT
    # 11 UTC = 08h BRT
    # 13 UTC = 10h BRT
    # 15 UTC = 12h BRT
    # 17 UTC = 14h BRT
    # 19 UTC = 16h BRT
    # 21 UTC = 18h BRT
    # 23 UTC = 20h BRT
    #
    # Minuto 17 para evitar o congestionamento do :00
    - cron: '17 1,3,7-23/2 * * *'
  workflow_dispatch:

env:
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

jobs:
  coleta:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Clonar o repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Verificar versão do Node.js
        run: |
          node --version
          npm --version

      - name: 📦 Instalar dependências
        working-directory: scripts
        run: |
          npm install

      - name: 🔑 Criar arquivo de credenciais do Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccount.json
          echo "✅ Arquivo de credenciais criado."

      - name: 🔍 Verificar credenciais do Firebase
        run: |
          if [ ! -s serviceAccount.json ]; then
            echo "❌ Arquivo serviceAccount.json não foi criado."
            exit 1
          fi
          echo "✅ Arquivo de credenciais validado."

      - name: 🚀 Executar coleta de notícias
        working-directory: scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/serviceAccount.json
        run: |
          node coletar.js

      - name: 🗑️ Limpar arquivo de credenciais
        if: always()
        run: |
          rm -f serviceAccount.json
          echo "✅ Credenciais removidas."

      - name: 📊 Resumo da execução
        if: always()
        run: |
          echo "✅ Coleta finalizada em $(date)"
